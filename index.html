<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>π VOLUME — Petrikov</title>
<style>
*{box-sizing:border-box}
body{
    margin:0; min-height:100vh; overflow-x:hidden;
    display:flex; justify-content:center; align-items:center;
    font-family:Arial,Helvetica,sans-serif; color:#fff;
    background:
      radial-gradient(circle at 15% 15%,rgba(0,174,255,.25),transparent 30%),
      radial-gradient(circle at 85% 80%,rgba(65,105,225,.25),transparent 30%),
      linear-gradient(135deg,#020617,#061a3a 48%,#031027);
}
body:before,body:after{
    content:"✦  ✧  ◆  ✦  ✧";
    position:fixed; font-size:32px; letter-spacing:22px;
    color:rgba(80,190,255,.28); pointer-events:none;
    animation:float 8s ease-in-out infinite;
}
body:before{top:7%;left:4%}
body:after{bottom:7%;right:4%;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
.contenedor{
    position:relative; width:min(92%,650px); margin:28px auto;
    padding:34px 30px;
    text-align:center; border-radius:28px;
    background:rgba(3,15,38,.88);
    border:1px solid rgba(72,181,255,.35);
    box-shadow:0 0 45px rgba(0,140,255,.18),inset 0 0 35px rgba(0,100,220,.08);
    backdrop-filter:blur(10px);
}
h1{
    margin:0; font-size:clamp(42px,8vw,64px);
    letter-spacing:3px;
    background:linear-gradient(90deg,#6dd5ff,#fff,#4da3ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
}
.descripcion{color:#a9c7e8;margin:8px 0 22px}
.pi{
    color:#59c7ff;font-size:22px;letter-spacing:4px;
    margin-bottom:22px;text-shadow:0 0 15px rgba(40,170,255,.55)
}
button,select,#entrada{
    font-family:inherit;
}
button{
    border:0; border-radius:14px; padding:13px 19px;
    font-size:16px; font-weight:bold; cursor:pointer;
    color:#fff; background:linear-gradient(135deg,#087eea,#164edb);
    box-shadow:0 8px 20px rgba(0,100,255,.2);
    transition:.18s;
}
button:hover{transform:translateY(-2px);filter:brightness(1.12)}
button:active{transform:scale(.98)}
.navegacion{
    display:flex; gap:10px; justify-content:center; align-items:center;
    margin-top:16px; flex-wrap:wrap
}
.navegacion button{min-width:125px}
select,#entrada{
    width:min(100%,500px); padding:15px 16px; margin-top:16px;
    border-radius:13px; border:1px solid rgba(86,181,255,.35);
    outline:none; color:#fff; background:#06152e;
}
select{font-size:16px}
#entrada{
    font-size:23px; text-align:center;
    box-shadow:inset 0 0 18px rgba(0,90,180,.1)
}
#entrada:focus,select:focus{border-color:#49baff;box-shadow:0 0 0 3px rgba(40,160,255,.12)}
#mensaje{min-height:24px;margin:17px 0 8px;font-weight:bold}
.correcto{color:#66d3ff}.error{color:#ff6b83}
.volumen{margin-top:18px;font-size:24px}
.barra{
    width:100%;height:28px;margin-top:12px;border-radius:20px;
    overflow:hidden;background:#0a2244;border:1px solid rgba(82,181,255,.18)
}
#barraVolumen{
    width:0%;height:100%;
    background:linear-gradient(90deg,#087eea,#36c7ff,#d6f5ff);
    transition:width .2s; box-shadow:0 0 18px rgba(45,184,255,.5)
}
.contador{color:#9db9d8;margin-top:13px}
.instagram{
    margin-top:25px; font-size:15px; color:#91add0
}
.instagram a{color:#59c7ff;text-decoration:none;font-weight:bold}
.instagram a:hover{text-decoration:underline}
.nota{font-size:12px;color:#6f8cac;margin-top:12px}
</style>
</head>
<body>
<div class="contenedor">
    <h1>π VOLUME</h1>
    <div class="descripcion">Escribe los números de π para aumentar el volumen</div>
    <div class="pi">3.14159265358979323846</div>

    <button onclick="reproducir()">▶ REPRODUCIR</button>

    <select id="canciones" onchange="cambiarCancion()">
        <option value="Creeper vs Zombies.mp3">Creeper vs Zombies</option>
        <option value="Doma.weba">Doma</option>
        <option value="En El Muelle de San Blas.weba">En El Muelle de San Blas</option>
        <option value="Flaca.weba">Flaca</option>
        <option value="Loco (Tu Forma de Ser).weba">Loco (Tu Forma de Ser)</option>
        <option value="Luma.mp4">Luma</option>
        <option value="Luna.weba">Luna</option>
        <option value="QUÍEN TE QUIERE COMO EL NENE.mp3">QUÍEN TE QUIERE COMO EL NENE</option>
        <option value="Volver a Vernos (1).mp4">Volver a Vernos</option>
        <option value="JPN.mp3">JPN</option>
        <option value="MAMI 100PRE SABE.mp4">MAMI 100PRE SABE</option>
    </select>

    <div class="navegacion">
        <button onclick="cancionAnterior()">⏮ Anterior</button>
        <button onclick="cancionSiguiente()">Siguiente ⏭</button>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <input id="entrada" type="text" inputmode="numeric" placeholder="Escribe π..." autocomplete="off">

    <div id="mensaje">Escribe los dígitos de π para comenzar</div>

    <div class="volumen">Volumen: <strong><span id="numeroVolumen">0</span>%</strong></div>
    <div class="barra"><div id="barraVolumen"></div></div>

    <div class="contador">
        Números correctos: <strong><span id="contador">0</span></strong>
    </div>

    <div class="instagram">
        Instagram:
        <a href="https://www.instagram.com/petrikov_xn/" target="_blank" rel="noopener">@petrikov_xn</a>
    </div>
    <div class="nota">El progreso de π y el volumen se conservan al cambiar de canción.</div>
</div>

<script>
const PI = "314159265358979323846264338327950288419716939937510";
let posicion = 0;

const entrada = document.getElementById("entrada");
const audio = document.getElementById("audio");
const canciones = document.getElementById("canciones");
const mensaje = document.getElementById("mensaje");
const numeroVolumen = document.getElementById("numeroVolumen");
const barraVolumen = document.getElementById("barraVolumen");
const contador = document.getElementById("contador");

audio.src = encodeURI(canciones.value);

function aplicarMensaje(texto, clase) {
    mensaje.textContent = texto;
    mensaje.className = clase || "";
}

function reproducir() {
    if (posicion <= 0) {
        aplicarMensaje("✏️ Primero escribe los dígitos de π para comenzar", "error");
        entrada.focus();
        return;
    }

    audio.volume = Math.min(posicion * 10, 100) / 100;
    audio.play().then(() => {
        aplicarMensaje("🔊 Reproduciendo — volumen " + Math.min(posicion * 10, 100) + "%", "correcto");
    }).catch(() => {
        aplicarMensaje("⚠️ No se pudo reproducir esta canción. Presiona reproducir otra vez.", "error");
    });
}

function cambiarCancion() {
    const nuevoSrc = canciones.value;
    const estabaReproduciendo = !audio.paused && !audio.ended;

    audio.pause();
    audio.src = encodeURI(nuevoSrc);
    audio.volume = Math.min(posicion * 10, 100) / 100;
    audio.load();

    // El progreso de π y el volumen se conservan.
    if (posicion <= 0) {
        aplicarMensaje("🎵 Canción cambiada. Escribe los dígitos de π para reproducir.", "correcto");
        return;
    }

    aplicarMensaje("🎵 Canción cambiada — progreso de π conservado", "correcto");

    if (estabaReproduciendo) {
        audio.play().catch(() => {
            aplicarMensaje("🎵 Canción cambiada. Presiona reproducir para continuar.", "correcto");
        });
    }
}

function cancionAnterior() {
    canciones.selectedIndex =
        (canciones.selectedIndex - 1 + canciones.options.length) % canciones.options.length;
    cambiarCancion();
}

function cancionSiguiente() {
    canciones.selectedIndex =
        (canciones.selectedIndex + 1) % canciones.options.length;
    cambiarCancion();
}

audio.addEventListener("ended", () => {
    // Al terminar una canción, cambia automáticamente sin reiniciar π.
    cancionSiguiente();
});

entrada.addEventListener("input", () => {
    let texto = entrada.value.replace(/[^0-9]/g, "");
    entrada.value = texto;

    if (texto.length === 0) {
        // Solo borrar/reiniciar la entrada reduce el progreso.
        posicion = 0;
        actualizarVolumen();
        aplicarMensaje("Escribe 3 para comenzar", "");
        return;
    }

    const ultimo = texto[texto.length - 1];

    if (ultimo === PI[posicion]) {
        posicion++;
        actualizarVolumen();

        if (posicion * 10 >= 100) {
            aplicarMensaje("🔥 ¡VOLUMEN MÁXIMO!", "correcto");
        } else {
            aplicarMensaje("✓ Correcto", "correcto");
        }
    } else {
        posicion = 0;
        actualizarVolumen();
        aplicarMensaje("✗ Te equivocaste. Reiniciando...", "error");

        setTimeout(() => {
            entrada.value = "";
        }, 300);
    }
});

function actualizarVolumen() {
    const volumen = Math.min(posicion * 10, 100);
    audio.volume = volumen / 100;
    numeroVolumen.textContent = volumen;
    barraVolumen.style.width = volumen + "%";
    contador.textContent = posicion;
}
</script>
</body>
</html>
